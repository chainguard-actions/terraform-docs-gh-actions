name: Test fail-on-diff with no diff
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          working-dir: tests/fixtures/tf-module
          output-format: markdown table
          output-method: print
          git-push: "false"
          fail-on-diff: "false"
        continue-on-error: true

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          NUM_CHANGED: ${{ steps.action.outputs.num_changed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "num_changed: $NUM_CHANGED"
          if [ "$OUTCOME" = "success" ]; then
            # print method never modifies files, so num_changed should be 0
            if [ "$NUM_CHANGED" != "0" ]; then
              echo "FAIL: expected num_changed=0 for print method, got '$NUM_CHANGED'"
              exit 1
            fi
            echo "PASS: fail-on-diff=false with print method succeeded, num_changed=$NUM_CHANGED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (docker or git issue in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
