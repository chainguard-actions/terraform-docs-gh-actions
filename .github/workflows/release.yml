name: release
run-name: release v${{ github.event.inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "gh-actions version to be released (without leading v)"
        required: true
        type: string

env:
  GOMPLATE_VERSION: "v3.8.0"
  REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.COMMITTER_TOKEN }}

      - name: Install gomplate
        env:
          GOMPLATE_VERSION: ${{ env.GOMPLATE_VERSION }}
        run: |
          safe_version=$(printf '%s' "$GOMPLATE_VERSION" | tr -d '\n\r')
          sudo curl -o /usr/local/bin/gomplate -sSL "https://github.com/hairyhenderson/gomplate/releases/download/${safe_version}/gomplate_linux-amd64"
          sudo chmod 755 /usr/local/bin/gomplate

      - name: Get variables
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          safe_version=$(printf '%s' "$INPUT_VERSION" | tr -d '\n\r')
          release_version="${safe_version//v/}"
          echo "release_version=${release_version}" >> "$GITHUB_ENV"

      - name: Prepare Release
        run: |
          ./.github/scripts/prepare-release.sh "$release_version"

      - name: Push Release Changes
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
        with:
          file_pattern: "README.md action.yml"
          commit_message: "chore: prepare release v${{ env.release_version }}"
          commit_user_name: terraform-docs-bot
          commit_user_email: bot@terraform-docs.io
          commit_author: "terraform-docs-bot <bot@terraform-docs.io>"
          commit_options: "--signoff"

  docker:
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Get variables
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          safe_version=$(printf '%s' "$INPUT_VERSION" | tr -d '\n\r')
          release_version="${safe_version//v/}"
          echo "release_version=${release_version}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: env.REGISTRY_USERNAME != ''
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        if: env.REGISTRY_USERNAME != ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          outputs: "type=registry"
          platforms: linux/amd64,linux/arm64
          push: true
          tags: quay.io/terraform-docs/gh-actions:latest,quay.io/terraform-docs/gh-actions:${{ env.release_version }}

  update-tag:
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.COMMITTER_TOKEN }}

      - name: Get variables
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          safe_version=$(printf '%s' "$INPUT_VERSION" | tr -d '\n\r')
          release_version="${safe_version//v/}"
          echo "release_version=${release_version}" >> "$GITHUB_ENV"

      - name: Cut Release
        env:
          RELEASE_VERSION: ${{ env.release_version }}
        run: |
          git config --global user.name terraform-docs-bot
          git config --global user.email bot@terraform-docs.io

          git tag "v${RELEASE_VERSION}"
          git push origin "v${RELEASE_VERSION}"

          VERSION=$(echo "$RELEASE_VERSION" | cut -d. -f1)
          git tag -f "v${VERSION}"
          git push -f origin "v${VERSION}"
