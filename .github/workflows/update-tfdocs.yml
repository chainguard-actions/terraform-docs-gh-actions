name: update-terraform-docs
run-name: update terraform-docs version

on:
  repository_dispatch:
    types: [trigger-workflow]
  workflow_dispatch:
    inputs:
      release-version:
        description: "terraform-docs new release version"
        required: true
        type: string

env:
  GOMPLATE_VERSION: "v3.8.0"

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.COMMITTER_TOKEN }}

      - name: Install gomplate
        env:
          GOMPLATE_VERSION: ${{ env.GOMPLATE_VERSION }}
        run: |
          safe_version=$(printf '%s' "$GOMPLATE_VERSION" | tr -d '\n\r')
          sudo curl -sSLo /usr/local/bin/gomplate "https://github.com/hairyhenderson/gomplate/releases/download/${safe_version}/gomplate_linux-amd64"
          sudo chmod 755 /usr/local/bin/gomplate

      - name: Get variables
        env:
          PAYLOAD_VERSION: ${{ github.event.client_payload.release-version }}
          INPUT_VERSION: ${{ inputs.release-version }}
        run: |
          if [ -n "$PAYLOAD_VERSION" ]; then
            raw_version="$PAYLOAD_VERSION"
          else
            raw_version="$INPUT_VERSION"
          fi
          safe_version=$(printf '%s' "$raw_version" | tr -d '\n\r')
          release_version="${safe_version//v/}"
          echo "release_version=${release_version}" >> "$GITHUB_ENV"

      - name: Bump to terraform-docs version
        run: |
          ./.github/scripts/prepare-release.sh "" "$release_version"

      - name: Push terraform-docs Changes
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
        with:
          file_pattern: "README.md Dockerfile"
          commit_message: "chore: bump terraform-docs to v${{ env.release_version }}"
          commit_user_name: terraform-docs-bot
          commit_user_email: bot@terraform-docs.io
          commit_author: "terraform-docs-bot <bot@terraform-docs.io>"
          commit_options: "--signoff"
